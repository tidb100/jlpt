[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--zh); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 32px 48px;

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.card.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.plate { height: 104px; position: relative; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 14px; }

.romaji { color: var(--accent); font-size: .9rem; letter-spacing: .03em; }
.zh { font-weight: 700; }
.ex { font-size: .82rem; color: var(--muted); margin-top: 6px; display: grid; gap: 1px; }
.ex b { font-family: var(--jp); font-weight: 700; color: var(--fg); font-size: .92rem; }
.ex .exkana { font-family: var(--jp); overflow-wrap: anywhere; }

.exline { display: flex; align-items: baseline; gap: 6px; }
.why { flex: none; width: 1.35em; height: 1.35em; padding: 0; border-radius: 50%; font-size: .78rem; font-weight: 700; line-height: 1; color: var(--accent); border-color: var(--accent); background: transparent; align-self: center; }

.an-h { font-size: .7rem; letter-spacing: .1em; color: var(--muted); }
.an-parts { display: flex; flex-wrap: wrap; gap: 6px; }
.part { display: grid; gap: 1px; padding: 5px 8px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); min-width: 0; }

.btns { display: flex; gap: 6px; margin-top: 10px; }

<script>
const AUDIO = {};
const DECK = JSON.parse(document.getElementById("deck").textContent);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ALL = [];
const host = document.getElementById("sections");
DECK.forEach(sec => {
  const s = document.createElement("section");
  s.innerHTML = `<h2>${esc(sec.title)}</h2><p class="rule">${sec.rule}</p><div class="grid"></div>`;
  const grid = s.querySelector(".grid");
  sec.cards.forEach(c => {
    const i = ALL.push(c) - 1;
    const len = c.fig.length;
    const el = document.createElement("article");
    el.className = "card " + sec.id;
    el.id = "c" + i;
    el.innerHTML = `
      <div class="plate">
        ${c.tag ? `<span class="tag">${esc(c.tag)}</span>` : ""}
        ${c.kj ? `<span class="kj">${esc(c.kj)}</span>` : ""}
        <span class="fig ${len > 8 ? "s" : len > 5 ? "m" : ""}">${esc(c.fig)}</span>
      </div>
      <div class="body">
        <span class="kana">${esc(c.kana)}</span>
        <span class="romaji">${esc(c.ro)}</span>
        <span class="zh">${esc(c.zh)}</span>
        <span class="ex"><span class="exline">${c.an ? `<button type="button" class="why" aria-expanded="false" aria-controls="an${i}" title="句子解析" aria-label="解析例句 ${esc(c.ex)}">?</button>` : ""}<b>${esc(c.ex)}</b></span>${c.exKana ? `<span class="exkana">${esc(c.exKana)}</span>` : ""}<span class="exro">${esc(c.exRo)}</span><span>${esc(c.exZh)}</span></span>
        ${c.an ? `<div class="an" id="an${i}" hidden>
          <span class="an-h">逐词拆解</span>
          <div class="an-parts">${c.an.p.map(([jp, ro, m]) => `<span class="part"><b>${esc(jp)}</b><span class="r">${esc(ro)}</span><span class="m">${esc(m)}</span></span>`).join("")}</div>
          <p class="an-note"><b>要点：</b>${esc(c.an.n)}</p>
        </div>` : ""}
        <div class="btns">
          <button type="button" data-say="${esc(c.say)}" data-i="${i}" aria-label="播放 ${esc(c.kana)}">▶ 单词</button>
          <button type="button" data-say="${esc(c.ex)}" data-i="${i}" aria-label="播放例句 ${esc(c.ex)}">▶ 例句</button>
        </div>
      </div>`;
    grid.appendChild(el);
  });
  host.appendChild(s);
});

const synth = window.speechSynthesis;
const note = document.getElementById("note");
let jaVoice = null, slow = false, current = null;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang) && /google|kyoko|otoya|nanami|haruka/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
if (Object.keys(AUDIO).length) note.textContent = "发音：Microsoft Nanami 神经语音录音（Edge TTS）。";
else if (!synth) { note.textContent = "当前浏览器不支持语音播放，请换用 Chrome、Edge 或 Safari 打开。"; note.dataset.warn = ""; }

function mark(i) {
  document.querySelectorAll(".card.playing").forEach(e => e.classList.remove("playing"));
  if (i != null) document.getElementById("c" + i)?.classList.add("playing");
}
let session = 0;
function stopAll() { session++; if (current) { current.pause(); current = null; } if (synth) synth.cancel(); mark(null); }
function say(text, i) {
  return new Promise(res => {
    const src = AUDIO[text];
    if (src) {
      const a = new Audio(src);
      current = a;
      a.playbackRate = slow ? 0.75 : 1;
      a.onplay = () => mark(i);
      a.onended = a.onerror = a.onpause = () => { mark(null); res(); };
      a.play().catch(() => { mark(null); res(); });
      return;
    }
    if (!synth) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = slow ? 0.6 : 0.9;
    u.onstart = () => mark(i);
    u.onend = u.onerror = () => { mark(null); res(); };
    synth.speak(u);
  });
}

let loop = false, active = false;
const playAllBtn = document.getElementById("playAll");
const wait = ms => new Promise(r => setTimeout(r, ms));
function setRunning(on) { active = on; playAllBtn.textContent = on ? "■ 停止" : "▶ 全部播放"; }
const LOOP_MAX_MS = 30 * 60 * 1000;  // 循环播放最长 30 分钟，到时自动停止
function flash(msg) {
  const base = note.textContent;
  note.textContent = msg;
  setTimeout(() => { if (note.textContent === msg) note.textContent = base; }, 10000);
}
async function runQueue(items) {
  stopAll();
  const my = session, start = Date.now();
  setRunning(true);
  do {
    for (const it of items) {
      await say(it.text, it.i);
      if (my !== session) return;
      if (loop && Date.now() - start >= LOOP_MAX_MS) { setRunning(false); flash("已循环播放 30 分钟，自动停止。"); return; }
      await wait(items.length > 1 ? 500 : 900);
      if (my !== session) return;
    }
  } while (loop);
  setRunning(false);
}

host.addEventListener("click", e => {
  const b = e.target.closest("button[data-say]");
  if (b) { runQueue([{ text: b.dataset.say, i: +b.dataset.i }]); return; }
  const why = e.target.closest("button.why");
  if (why) {
    const panel = document.getElementById(why.getAttribute("aria-controls"));
    const open = why.getAttribute("aria-expanded") !== "true";
    why.setAttribute("aria-expanded", String(open));
    panel.hidden = !open;
    return;
  }
  if (e.target.closest(".an")) return;
  const card = e.target.closest(".card");
  if (card && document.getElementById("app").classList.contains("quiz")) card.classList.toggle("shown");
});

playAllBtn.addEventListener("click", () => {
  if (active) { stopAll(); setRunning(false); return; }
  runQueue(ALL.map((c, i) => ({ text: c.say, i })));
});

document.getElementById("loop").addEventListener("click", e => {
  loop = !loop;
  e.currentTarget.setAttribute("aria-pressed", String(loop));
});

document.getElementById("quiz").addEventListener("click", e => {
  const on = document.getElementById("app").classList.toggle("quiz");
  document.querySelectorAll(".card.shown").forEach(c => c.classList.remove("shown"));
  e.currentTarget.setAttribute("aria-pressed", String(on));
});

document.getElementById("slow").addEventListener("click", e => {
  slow = !slow;
  e.currentTarget.setAttribute("aria-pressed", String(slow));
});
</script>
