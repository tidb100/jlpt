<style>
/* Layout: a single header line, then a grid of paint-chip cards; each chip is the real color, the label strip below holds kana, romaji, Chinese and the play controls */
:root {
  --bg: #f6f5f2;
  --card: #ffffff;
  --fg: #22211f;
  --muted: #6d6a64;
  --line: #e2dfd8;
  --accent: #1e50a2;
  --jp: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171716; --card: #222120; --fg: #efede8; --muted: #a29e96; --line: #36342f; --accent: #8fb0ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171716; --card: #222120; --fg: #efede8; --muted: #a29e96; --line: #36342f; --accent: #8fb0ea; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--zh); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 32px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
h1 { font-family: var(--jp); font-weight: 900; font-size: 2rem; margin: 0; text-wrap: balance; }
h1 small { display: block; font-family: var(--zh); font-weight: 500; font-size: .95rem; color: var(--muted); margin-top: 4px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 8px 14px; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.note { font-size: .85rem; color: var(--muted); margin: 0 0 20px; }
.note[data-warn] { color: #b3261e; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
.chip.playing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.sw { height: 110px; position: relative; border-bottom: 1px solid var(--line); }
.sw .hex { position: absolute; left: 10px; bottom: 8px; font: 500 .72rem ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em; opacity: .85; }
.sw .kanji { position: absolute; right: 12px; top: 8px; font-family: var(--jp); font-weight: 900; font-size: 1.9rem; }
.body { padding: 12px 14px 14px; display: grid; gap: 4px; }
.kana { font-family: var(--jp); font-weight: 700; font-size: 1.35rem; }
.romaji { color: var(--accent); font-size: .9rem; letter-spacing: .03em; }
.zh { font-weight: 700; }
.ex { font-size: .82rem; color: var(--muted); margin-top: 4px; }
.ex b { font-family: var(--jp); font-weight: 700; color: var(--fg); }
.exro { display: block; color: var(--accent); letter-spacing: .03em; }
.btns { display: flex; gap: 6px; margin-top: 8px; }
.btns button { padding: 6px 12px; font-size: .85rem; }
/* 遮住读音：练习时隐藏假名和罗马音，点卡片显示 */
.quiz .chip:not(.shown) :is(.kana, .romaji, .exro) { color: transparent; background: var(--line); border-radius: 4px; }
.quiz .chip:not(.shown) { cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .chip { transition: box-shadow .15s, border-color .15s; } }
</style>

const COLORS = [
  { k: "赤", kana: "あか", ro: "aka", zh: "红色", hex: "#D7003A", ex: "あかいりんご", exK: "赤いりんご", exZh: "红苹果", exRo: "akai ringo" },
  { k: "青", kana: "あお", ro: "ao", zh: "蓝色", hex: "#1E50A2", ex: "あおいそら", exK: "青い空", exZh: "蓝天", exRo: "aoi sora" },
  { k: "黄色", kana: "きいろ", ro: "kiiro", zh: "黄色", hex: "#F8C800", ex: "きいろいはな", exK: "黄色い花", exZh: "黄色的花", exRo: "kiiroi hana" },
  { k: "緑", kana: "みどり", ro: "midori", zh: "绿色", hex: "#2E9E4F", ex: "みどりのき", exK: "緑の木", exZh: "绿色的树", exRo: "midori no ki" },
  { k: "白", kana: "しろ", ro: "shiro", zh: "白色", hex: "#FFFFFF", ex: "しろいゆき", exK: "白い雪", exZh: "白雪", exRo: "shiroi yuki" },
  { k: "黒", kana: "くろ", ro: "kuro", zh: "黑色", hex: "#1A1A1A", ex: "くろいねこ", exK: "黒い猫", exZh: "黑猫", exRo: "kuroi neko" },
  { k: "茶色", kana: "ちゃいろ", ro: "chairo", zh: "棕色", hex: "#7B4A2D", ex: "ちゃいろいいぬ", exK: "茶色い犬", exZh: "棕色的狗", exRo: "chairoi inu" },

  { k: "灰色", kana: "はいいろ", ro: "haiiro", zh: "灰色", hex: "#8E8E8E", ex: "はいいろのくも", exK: "灰色の雲", exZh: "灰色的云", exRo: "haiiro no kumo" },
  { k: "ピンク", kana: "ぴんく", ro: "pinku", zh: "粉色", hex: "#F4A7B9", ex: "ぴんくのかばん", exK: "ピンクのかばん", exZh: "粉色的包", exRo: "pinku no kaban", katakana: true },

function ink(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#1a1a1a" : "#ffffff";
}

const grid = document.getElementById("grid");
COLORS.forEach((c, i) => {
  const el = document.createElement("article");
  el.className = "chip";
  el.id = "c" + i;
  el.innerHTML = `
    <div class="sw" style="background:${c.hex};color:${ink(c.hex)}">
      <span class="kanji">${c.k}</span><span class="hex">${c.hex}</span>
    </div>
    <div class="body">
      <span class="kana">${c.kana}</span>
      <span class="romaji">${c.ro}</span>
      <span class="zh">${c.zh}</span>
      <span class="ex"><b>${c.exK}</b> · ${c.exZh}<span class="exro">${c.exRo}</span></span>
      ${c.katakana ? '<span class="ex">外来语，日常写作片假名 ピンク</span>' : ""}
      <div class="btns">
        <button type="button" data-say="${c.katakana ? 'ピンク' : c.kana}" data-i="${i}" aria-label="播放 ${c.kana}">▶ 单词</button>
        <button type="button" data-say="${c.exK}" data-i="${i}" aria-label="播放例句 ${c.exK}">▶ 例句</button>
      </div>
    </div>`;
  grid.appendChild(el);
});

const synth = window.speechSynthesis;
const note = document.getElementById("note");
let jaVoice = null, slow = false;
function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  jaVoice = vs.find(v => /^ja/i.test(v.lang) && /google|kyoko|otoya|nanami|haruka/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
if (Object.keys(AUDIO).length) note.textContent = "发音：Microsoft Nanami 神经语音录音（Edge TTS）。";
else if (!synth) { note.textContent = "当前浏览器不支持语音播放，请换用 Chrome、Edge 或 Safari 打开。"; note.dataset.warn = ""; }

function mark(i) {
  document.querySelectorAll(".chip.playing").forEach(e => e.classList.remove("playing"));
  if (i != null) document.getElementById("c" + i)?.classList.add("playing");
}
let current = null;
let session = 0;
function stopAll() { session++; if (current) { current.pause(); current = null; } if (synth) synth.cancel(); mark(null); }
function say(text, i) {
  return new Promise(res => {
    const src = AUDIO[text];
    if (src) {
      const a = new Audio(src);
      current = a;
      a.playbackRate = slow ? 0.75 : 1;
      a.onplay = () => mark(i);
      a.onended = a.onerror = a.onpause = () => { mark(null); res(); };
      a.play().catch(() => { mark(null); res(); });
      return;
    }
    if (!synth) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    if (jaVoice) u.voice = jaVoice;
    u.rate = slow ? 0.6 : 0.9;
    u.onstart = () => mark(i);
    u.onend = u.onerror = () => { mark(null); res(); };
    synth.speak(u);
  });
}

let loop = false, active = false;
const playAllBtn = document.getElementById("playAll");
const wait = ms => new Promise(r => setTimeout(r, ms));
function setRunning(on) { active = on; playAllBtn.textContent = on ? "■ 停止" : "▶ 全部播放"; }
async function runQueue(items) {
  stopAll();
  const my = session;
  setRunning(true);
  do {
    for (const it of items) {
      await say(it.text, it.i);
      if (my !== session) return;
      await wait(items.length > 1 ? 500 : 900);
      if (my !== session) return;
    }
  } while (loop);
  setRunning(false);
}

grid.addEventListener("click", e => {
  const b = e.target.closest("button[data-say]");
  if (b) { runQueue([{ text: b.dataset.say, i: +b.dataset.i }]); return; }
  const card = e.target.closest(".chip");
  if (card && document.getElementById("app").classList.contains("quiz")) card.classList.toggle("shown");
});

playAllBtn.addEventListener("click", () => {
  if (active) { stopAll(); setRunning(false); return; }
  runQueue(COLORS.map((c, i) => ({ text: c.katakana ? "ピンク" : c.kana, i })));
});

document.getElementById("loop").addEventListener("click", e => {
  loop = !loop;
  e.currentTarget.setAttribute("aria-pressed", String(loop));
});

document.getElementById("quiz").addEventListener("click", e => {
  const on = document.getElementById("app").classList.toggle("quiz");
  document.querySelectorAll(".chip.shown").forEach(c => c.classList.remove("shown"));
  e.currentTarget.setAttribute("aria-pressed", String(on));
});

document.getElementById("slow").addEventListener("click", e => {
  slow = !slow;
  e.currentTarget.setAttribute("aria-pressed", String(slow));
});
</script>
